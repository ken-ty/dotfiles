# install.sh が $HOME に張る symlink の表。1 行 1 本。macos/doctor.sh も同じ表を読む。
#
#   src    リポジトリ ($HOME/dotfiles) からの相対パス
#   dest   $HOME からの相対パス (空白を含んでよい)
#   name   install.sh の確認と doctor の出力に出る名前
#   when   all    = どこでも張る
#          mac    = macOS だけ / ubuntu = Ubuntu だけ
#          末尾に -gui が付くものは --yes (サーバー) では張らない。doctor は無くても warn に留める
#
# 列は | 区切り (dest に空白があるので)。張るものを足すときはここに 1 行足すだけでよい。
#
# src|dest|name|when
.zshrc|.zshrc|.zshrc|all
asdf/.tool-versions|.tool-versions|.tool-versions|all
asdf/.default-gems|.default-gems|.default-gems|all
git/.gitconfig|.gitconfig|Git config|all
git/.gitconfig.local|.gitconfig.local|Git config (local)|all
git/ignore|.config/git/ignore|Git global ignore|all
vscode/settings.json|Library/Application Support/Code/User/settings.json|VSCode settings.json|mac-gui
vscode/settings.json|.config/Code/User/settings.json|VSCode settings.json|ubuntu-gui
