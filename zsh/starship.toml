# starship のプロンプト定義。.zshrc が STARSHIP_CONFIG でここを指す。
# 土台は公式プリセット Jetpack (version 1.0.0、`starship preset jetpack` が出すもの)。
#   https://starship.rs/presets/jetpack
# Jetpack は Nerd Font を使わず Unicode の幾何記号だけで描く。ただし Monaco はその記号を
# ほとんど持たないので、ターミナルのフォントは JetBrains Mono (macos/chunks/gui) にする。
# 右プロンプト (right_format) を使うので zsh の RPROMPT に載る。
#
# プリセットから変えた箇所には「# jetpack:」で理由を書いてある。それ以外はプリセットのまま。
# 書式: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"

# 左: 1 行目は差分の行数 (あるときだけ)、2 行目は実行時間・ssh 先の情報・◎
# jetpack: sudo を外した。毎回 `sudo -n` を叩いて 10〜78ms かかり、単独で最大のコストだった。
#          nix_shell / container / shlvl / shell / env_var も使わないので外した
format = """($fill$git_metrics\n)$cmd_duration\
$hostname\
$localip\
$jobs\
$username\
$character"""

# 右: ディレクトリ、git、そのリポジトリで使うツール、電池、時刻
# jetpack: 言語モジュールは手元のリポジトリにあるものだけ残した (dart 46 / node 27 / docker 7 /
#          python 1、2026-09 の ghq 配下)。dart は asdf の shim 経由で 192ms、swift は 710ms
#          かかるので外し、Flutter と Node は custom で .tool-versions を読む (下の [custom.*])
right_format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$docker_context\
$package\
$custom\
$python\
$status\
$battery\
$time"""

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic bright-yellow)"
error_symbol = "[○](italic purple)"
vimcmd_symbol = "[■](italic dimmed green)"

[username]
# ssh 先と root のときだけ出る (手元では出ない)
style_user = "bright-yellow bold italic"
style_root = "purple bold italic"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[hostname]
# jetpack: プリセットは既定のまま (ssh のときだけ、" on host" の形)。localip と並ぶので前後を整えた
ssh_only = true
format = "[$hostname]($style)"
style = "bold magenta"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta) "
disabled = false

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "□ "
read_only = " ◈"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold bright-blue)'

[cmd_duration]
format = "[◄ $duration ](italic white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic bright-blue)"
style = "italic bright-blue"
truncation_symbol = "⋯"
# jetpack: 11 → 40。feat/starship-modules のような名前が 11 文字では読めない
truncation_length = 40
# jetpack: ignore_branches = ["main", "master"] を外した。main にいることが分かるのが大事
#          (main にいるならまずブランチを切る、という運用)
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic bright-blue"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic bright-magenta)"
ahead = "[▴│[${count}](bold white)│](italic green)"
behind = "[▿│[${count}](bold white)│](italic red)"
diverged = "[◇ ▴┤[${ahead_count}](regular white)│▿┤[${behind_count}](regular white)│](italic bright-magenta)"
untracked = "[◌◦](italic bright-yellow)"
stashed = "[◃◈](italic white)"
modified = "[●◦](italic yellow)"
staged = "[▪┤[$count](bold white)│](italic bright-cyan)"
renamed = "[◎◦](italic bright-blue)"
deleted = "[✕](italic red)"

[custom.flutter]
# jetpack: dart モジュールの代わり。pubspec.yaml があるところで asdf が選ぶ Flutter の版を出す
#          (dart --version は shim 経由で 192ms、asdf current は 10ms)
description = "asdf が選んでいる Flutter の版"
detect_files = ["pubspec.yaml"]
command = "asdf current --no-header flutter | awk '{sub(/-stable$/, \"\", $2); print $2}'"
format = " flutter [◁◅ ($output )]($style)"
style = "bold blue"

[custom.node]
# jetpack: nodejs モジュールの代わり。package.json があるところで asdf が選ぶ Node の版を出す
#          (node --version は shim 経由で 110ms)。見た目はプリセットの nodejs に合わせた
description = "asdf が選んでいる Node.js の版"
detect_files = ["package.json"]
command = "asdf current --no-header nodejs | awk '{print $2}'"
format = " [node](italic) [◫ ($output)](bold bright-green)"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold bright-blue)⌊ "
version_format = "${raw}"
style = "bold bright-yellow"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow italic bold"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[gcloud]
# jetpack: 切った。~/.config/gcloud があるので毎回アカウントのメールアドレスが出てしまう
#          (授業や画面共有で見せたくない)。aws はプリセットの時点で disabled
disabled = true
