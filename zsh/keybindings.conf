# zsh のキーバインド。1 行 1 バインド。`keybind list` で実測と突き合わせて見る。
#
#   key      bindkey の表記 (^] / ^[c = Alt+C / ^I = Tab)
#   widget   zle のウィジェット名。zsh/widgets/<name>.zsh か fzf --zsh が定義する
#   state    on = 縛る / off = 縛らない (その key がこの widget に縛られていれば外す)
#   説明     4 列目以降は全部説明
#
# この機械だけ変えたいときは ~/.zsh-keybindings.local に同じ書式で書く (後勝ち)。
# 手で書くより `keybind on|off <key> [widget]` の方が楽。全機械で変えるならここを直す。
#
# key    widget               state  説明
^]       cd-ghq-list--fzf     on     ghq のリポジトリを fzf で選んで cd
^R       fzf-history-widget   on     fzf 付属: 履歴を fzf で検索 (重複排除・複数行対応)
^R       fzf-select-history   off    dotfiles 自前の履歴検索。2026-09-15 に fzf 付属へ寄せた。戻すなら上を off にしてこれを on
^T       fzf-file-widget      on     fzf 付属: ファイルを選んでカーソル位置に挿入
^[c      fzf-cd-widget        on     fzf 付属: ディレクトリを選んで cd (Alt+C)
^I       fzf-completion       on     fzf 付属: `vim **<Tab>` のような ** 補完
